        entity_id: input_boolean.floor_lamp_state
    level: '{{ states(''input_number.floor_lamp_level'')|int(255) }}'
    set_level:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.floor_lamp_state
    - action: input_number.set_value
