    unique_id: sim_bedroom_ceiling_fan
    state: '{{ is_state(''input_boolean.bedroom_ceiling_fan_state'',''on'') }}'
    percentage: '{{ states(''input_number.bedroom_ceiling_fan_speed'')|int(0) if is_state(''input_boolean.bedroom_ceiling_fan_state'',''on'') else 0 }}'
    speed_count: 3
    turn_on:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.bedroom_ceiling_fan_state
    turn_off:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.bedroom_ceiling_fan_state
    set_percentage:
    - if: '{{ percentage > 0 }}'
      then:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.bedroom_ceiling_fan_state
      - action: input_number.set_value
        target:
          entity_id: input_number.bedroom_ceiling_fan_speed
        data:
