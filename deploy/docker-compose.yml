# Home Assistant runs separately. Attach it to the external, INTERNAL `ha_private` network so only `app` can reach it:
#   docker network create --internal ha_private      (HA also joins a normal network for its own internet access)
# Network design: the app is only ever on internal networks, so it has no route to the internet. Its one way out is
# the `egress` proxy, which tunnels to push-service hosts on port 443 and nothing else (deploy/egress/proxy.ts).
services:
  app:
    # The updater swaps ALICE_IMAGE / ALICE_VERSION in release.env (see deploy/updater). Without it, the image is built here.
    image: ${ALICE_IMAGE:-alice-app:local}
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    environment:
      HA_URL: ${HA_URL:-http://homeassistant:8123}
      HA_TOKEN_FILE: /run/secrets/ha_token
      ORIGIN: https://${SITE_ADDRESS:-localhost}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost.invalid}
      EGRESS_PROXY: http://egress:3128
      BACKUP_DIRS: external=/backups/external
      APP_VERSION: ${ALICE_VERSION:-dev}
      UPDATES_OUT: /updates/out
      UPDATES_IN: /updates/in
    secrets: [ha_token]
    volumes:
      - app_data:/data
      # Point BACKUP_DIR at a mounted USB disk or network share. Must be writable by uid 1000 (bun).
      - ${BACKUP_DIR:-./backups}:/backups/external
      # Written by the host updater (read-only here), and the one place the app may ask it to install an approved release.
      - ${UPDATES_DIR:-./updates}/out:/updates/out:ro
      - ${UPDATES_DIR:-./updates}/in:/updates/in
    networks: [edge, ha_private, egress_net]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 8s
  egress:
    image: oven/bun:1-slim
    restart: unless-stopped
    command: ["bun", "/egress/proxy.ts"]
    volumes: ["./egress/proxy.ts:/egress/proxy.ts:ro"]
    networks: [egress_net, internet]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks: [edge, internet]   # not on ha_private; it needs the internet for its certificate
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
secrets:
  ha_token:
    file: ./secrets/ha_token
volumes:
  app_data:
  caddy_data:
networks:
  edge: { internal: true }
  egress_net: { internal: true }
  internet: {}
  ha_private:
    external: true
